<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oceanus - نظام إدارة التشغيلات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a3a5c; --primary-light: #234e7d; --accent-blue: #2d6ea8;
      --accent-orange: #e8890c; --accent-green: #2ecc71; --accent-red: #e74c3c;
      --bg: #eef2f7; --bg-card: #ffffff; --text: #1a2533; --text-muted: #7f8c9a;
      --border: #dde3ec; --shadow: 0 2px 12px rgba(26,58,92,0.08);
      --shadow-hover: 0 8px 24px rgba(26,58,92,0.15); --radius: 14px; --radius-sm: 8px;
      --nav-width: 230px; --topbar-height: 62px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Cairo',sans-serif; background:var(--bg); color:var(--text); direction:rtl; min-height:100vh; }

    /* TOPBAR */
    .topbar { position:fixed; top:0; left:0; right:0; height:var(--topbar-height); background:var(--bg-card); border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    .topbar-left { display:flex; align-items:center; gap:14px; }
    .sidebar-toggle { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; gap:5px; padding:6px; border-radius:6px; transition:background 0.2s; }
    .sidebar-toggle:hover { background:var(--bg); }
    .sidebar-toggle span { display:block; width:22px; height:2px; background:var(--primary); border-radius:2px; transition:all 0.3s; }
    .sidebar-toggle.open span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
    .sidebar-toggle.open span:nth-child(2) { opacity:0; width:0; }
    .sidebar-toggle.open span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }
    .logo-wrap { display:flex; align-items:center; gap:10px; cursor:pointer; }
    .logo-svg { width:40px; height:40px; }
    .logo-text-wrap { line-height:1.1; }
    .logo-name { font-size:19px; font-weight:900; color:var(--primary); letter-spacing:0.5px; display:block; }
    .logo-sub { font-size:9px; color:var(--accent-orange); font-weight:700; letter-spacing:2.5px; text-transform:uppercase; }
    .topbar-actions { display:flex; align-items:center; gap:10px; }
    .btn-topbar { display:flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--text); font-family:'Cairo',sans-serif; font-size:13px; font-weight:600; cursor:pointer; transition:all 0.2s; }
    .btn-topbar:hover { background:var(--primary); color:white; border-color:var(--primary); }

    /* SIDEBAR */
    .sidebar { position:fixed; top:var(--topbar-height); right:0; width:var(--nav-width); height:calc(100vh - var(--topbar-height)); background:var(--primary); padding:20px 0; overflow-y:auto; z-index:90; transition:transform 0.3s cubic-bezier(.4,0,.2,1); }
    .sidebar.collapsed { transform:translateX(100%); }
    .nav-item { display:flex; align-items:center; gap:12px; padding:13px 20px; color:rgba(255,255,255,0.7); cursor:pointer; transition:all 0.2s; font-size:14px; font-weight:600; border-right:3px solid transparent; }
    .nav-item:hover { background:rgba(255,255,255,0.08); color:white; }
    .nav-item.active { background:rgba(255,255,255,0.12); color:white; border-right-color:var(--accent-orange); }
    .nav-icon { font-size:18px; width:24px; text-align:center; }

    /* MAIN */
    .main { margin-right:var(--nav-width); margin-top:var(--topbar-height); padding:24px; min-height:calc(100vh - var(--topbar-height)); transition:margin-right 0.3s cubic-bezier(.4,0,.2,1); }
    .main.expanded { margin-right:0; }

    /* PAGE HEADER */
    .page-header { margin-bottom:24px; }
    .page-header h1 { font-size:22px; font-weight:900; color:var(--primary); }
    .page-header p { font-size:13px; color:var(--text-muted); margin-top:2px; }

    /* CARD */
    .card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); padding:20px; margin-bottom:16px; }
    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .card-title { font-size:15px; font-weight:700; color:var(--primary); }

    /* STATS */
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:24px; }
    .stat-card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); padding:18px; display:flex; align-items:center; gap:14px; box-shadow:var(--shadow); }
    .stat-icon { width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0; }
    .stat-icon.blue{background:#e8f0fa} .stat-icon.orange{background:#fef3e2} .stat-icon.green{background:#e8f8f1} .stat-icon.red{background:#fde8e8}
    .stat-info h3 { font-size:22px; font-weight:900; color:var(--primary); line-height:1; }
    .stat-info p { font-size:12px; color:var(--text-muted); margin-top:4px; font-weight:600; }

    /* TABLE */
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th { background:var(--bg); color:var(--text-muted); font-weight:700; padding:10px 14px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:11px 14px; border-bottom:1px solid var(--border); color:var(--text); }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#f8fafd; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; border-radius:var(--radius-sm); border:none; font-family:'Cairo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; }
    .btn-primary{background:var(--primary);color:white} .btn-primary:hover{background:var(--primary-light)}
    .btn-danger{background:var(--accent-red);color:white}
    .btn-success{background:var(--accent-green);color:white}
    .btn-sm{padding:5px 10px;font-size:12px}
    .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-outline:hover{border-color:var(--primary);color:var(--primary)}

    /* BADGE */
    .badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
    .badge-green{background:#e8f8f1;color:#27ae60} .badge-red{background:#fde8e8;color:#e74c3c}
    .badge-orange{background:#fef3e2;color:#e67e22} .badge-blue{background:#e8f0fa;color:#2d6ea8}

    /* MODAL */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:all 0.2s; }
    .modal-overlay.active { opacity:1; visibility:visible; }
    .modal { background:var(--bg-card); border-radius:var(--radius); width:90%; max-width:520px; max-height:85vh; overflow-y:auto; padding:24px; transform:translateY(20px); transition:transform 0.2s; }
    .modal-overlay.active .modal { transform:translateY(0); }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .modal-title { font-size:17px; font-weight:800; color:var(--primary); }
    .modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--text-muted); }

    /* FORM */
    .form-group { margin-bottom:16px; }
    .form-label { display:block; font-size:13px; font-weight:700; color:var(--text); margin-bottom:6px; }
    .form-control { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-family:'Cairo',sans-serif; font-size:13px; color:var(--text); background:var(--bg); transition:border-color 0.2s; direction:rtl; }
    .form-control:focus { outline:none; border-color:var(--accent-blue); background:white; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* LOADING / EMPTY / TOAST */
    .loading { display:flex; align-items:center; justify-content:center; gap:8px; padding:30px; color:var(--text-muted); font-size:13px; }
    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--accent-blue); border-radius:50%; animation:spin 0.8s linear infinite; }
    @keyframes spin{to{transform:rotate(360deg)}}
    .empty-state { text-align:center; padding:30px 20px; color:var(--text-muted); }
    .empty-state .empty-icon { font-size:36px; margin-bottom:10px; }
    .toast-container { position:fixed; bottom:24px; left:24px; z-index:300; display:flex; flex-direction:column; gap:8px; }
    .toast { background:var(--primary); color:white; padding:12px 18px; border-radius:var(--radius-sm); font-size:13px; font-weight:600; box-shadow:var(--shadow-hover); animation:slideIn 0.3s ease; }
    .toast.success{background:var(--accent-green)} .toast.error{background:var(--accent-red)}
    @keyframes slideIn{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

    /* HOME */
    .home-banner { background:linear-gradient(135deg,#1a3a5c 0%,#0f2340 100%); border-radius:var(--radius); padding:28px 32px; margin-bottom:24px; position:relative; overflow:hidden; }
    .home-banner::after { content:''; position:absolute; bottom:-30px; left:-30px; width:180px; height:180px; border-radius:50%; background:rgba(232,137,12,0.08); pointer-events:none; }
    .home-banner h2 { color:white; font-size:22px; font-weight:900; }
    .home-banner .date { color:rgba(255,255,255,0.45); font-size:12px; margin-bottom:6px; }
    .quick-links { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
    .quick-card { background:var(--bg-card); border-radius:var(--radius); border:1px solid var(--border); padding:22px 16px; text-align:center; cursor:pointer; transition:all 0.2s; box-shadow:var(--shadow); border-bottom:3px solid transparent; }
    .quick-card:hover { box-shadow:var(--shadow-hover); transform:translateY(-2px); }
    .quick-card.vehicles{border-bottom-color:var(--accent-blue)} .quick-card.operations{border-bottom-color:var(--accent-orange)}
    .quick-card.expenses{border-bottom-color:var(--accent-green)} .quick-card.reports{border-bottom-color:#f39c12}
    .quick-card .q-icon { font-size:30px; margin-bottom:8px; }
    .quick-card h3 { font-size:14px; font-weight:800; color:var(--primary); }
    .quick-card p { font-size:11px; color:var(--text-muted); margin-top:2px; }
    .bottom-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    /* ACTIVE OPS */
    .active-op-item { display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); }
    .active-op-item:last-child { border-bottom:none; }
    .active-op-info strong { display:block; font-size:13px; color:var(--primary); }
    .active-op-info span { font-size:11px; color:var(--text-muted); }

    /* VEHICLES STATUS */
    .v-status-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
    .v-status-box { background:var(--bg-card); border-radius:var(--radius-sm); padding:16px; text-align:center; border:1px solid var(--border); box-shadow:var(--shadow); }
    .v-status-box h3 { font-size:24px; font-weight:900; color:var(--primary); }
    .v-status-box p { font-size:11px; color:var(--text-muted); font-weight:600; margin-top:3px; }

    /* EXPORT POPUP */
    .popup-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:250; display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden; transition:all 0.2s; }
    .popup-overlay.active { opacity:1; visibility:visible; }
    .popup { background:white; border-radius:var(--radius); padding:28px; width:90%; max-width:320px; text-align:center; box-shadow:var(--shadow-hover); transform:scale(0.95); transition:transform 0.2s; }
    .popup-overlay.active .popup { transform:scale(1); }
    .popup h3 { font-size:16px; font-weight:800; color:var(--primary); margin-bottom:20px; }
    .export-btns { display:flex; gap:12px; justify-content:center; }
    .export-btn { flex:1; padding:16px 12px; border-radius:var(--radius-sm); border:2px solid var(--border); background:white; cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700; font-size:13px; transition:all 0.2s; display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--text); }
    .export-btn:hover { border-color:var(--accent-blue); background:#f0f6ff; color:var(--accent-blue); }
    .export-btn .exp-icon { font-size:28px; }

    @media(max-width:768px){
      .main{margin-right:0;padding:16px}
      .quick-links{grid-template-columns:repeat(2,1fr)}
      .bottom-grid{grid-template-columns:1fr}
      .form-row{grid-template-columns:1fr}
      .v-status-grid{grid-template-columns:repeat(3,1fr)}
    }
  </style>
</head>

  let tok=null, exp=0;
  async function getToken() {
    if(tok&&Date.now()<exp)return tok;
    const h={alg:"RS256",typ:"JWT"},n=Math.floor(Date.now()/1000);
    const c={iss:CONFIG.SERVICE_ACCOUNT.client_email,scope:"https://www.googleapis.com/auth/spreadsheets",aud:CONFIG.SERVICE_ACCOUNT.token_uri,exp:n+3600,iat:n};
    const b64=s=>btoa(JSON.stringify(s)).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
    const u=`${b64(h)}.${b64(c)}`;
    const kd=CONFIG.SERVICE_ACCOUNT.private_key.replace("-----BEGIN PRIVATE KEY-----\n","").replace("\n-----END PRIVATE KEY-----\n","").replace(/\n/g,"");
    const bk=Uint8Array.from(atob(kd),x=>x.charCodeAt(0));
    const ck=await crypto.subtle.importKey("pkcs8",bk.buffer,{name:"RSASSA-PKCS1-v1_5",hash:"SHA-256"},false,["sign"]);
    const sig=await crypto.subtle.sign("RSASSA-PKCS1-v1_5",ck,new TextEncoder().encode(u));
    const sb=btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g,"").replace(/\+/g,"-").replace(/\//g,"_");
    const r=await fetch(CONFIG.SERVICE_ACCOUNT.token_uri,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${u}.${sb}`});
    const d=await r.json();tok=d.access_token;exp=Date.now()+(d.expires_in-60)*1000;return tok;
  }
  async function get(n){const t=await getToken();const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(n)}`,{headers:{Authorization:`Bearer ${t}`}});const d=await r.json();return d.values||[];}
  async function append(n,v){const t=await getToken();await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(n)}:append?valueInputOption=USER_ENTERED`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({values:[v]})});}
  async function upd(n,i,v){const t=await getToken();await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(n+'!A'+i)}?valueInputOption=USER_ENTERED`,{method:"PUT",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({values:[v]})});}
  async function del(n,i){const t=await getToken();const mr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}`,{headers:{Authorization:`Bearer ${t}`}});const m=await mr.json();const s=m.sheets.find(x=>x.properties.title===n).properties.sheetId;await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}:batchUpdate`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:s,dimension:"ROWS",startIndex:i-1,endIndex:i}}}]})});}
  async function init(){const t=await getToken();const mr=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}`,{headers:{Authorization:`Bearer ${t}`}});const m=await mr.json();const ex=m.sheets.map(s=>s.properties.title);const req=Object.values(CONFIG.SHEETS).filter(s=>!ex.includes(s));if(req.length){await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}:batchUpdate`,{method:"POST",headers:{Authorization:`Bearer ${t}`,"Content-Type":"application/json"},body:JSON.stringify({requests:req.map(title=>({addSheet:{properties:{title}}}))})});const hdrs={[CONFIG.SHEETS.VEHICLES]:["ID","النوع","الماركة","الموديل","رقم اللوحة","السنة","الحالة","ملاحظات"],[CONFIG.SHEETS.OPERATIONS]:["ID","التاريخ","العربية","المورد","الوجهة","الإيراد","مصاريف التشغيلة","الحالة","ملاحظات"],[CONFIG.SHEETS.EXPENSES]:["ID","التشغيلة","النوع","البند","المبلغ","التاريخ","ملاحظات"]};for(const s of req)await append(s,hdrs[s]);}}
  return{get,append,upd,del,init};
})();

      <td>${ex.operation||'<span style="color:var(--text-muted)">عام</span>'}</td>
      <td><span class="badge ${bdg[ex.type]||'badge-blue'}">${ex.type}</span></td>
      <td>${ex.item}</td>
      <td><strong style="color:var(--accent-red)">${ex.amount.toLocaleString()} ج</strong></td>
      <td>${ex.date}</td>
      <td><button class="btn btn-sm btn-outline" onclick="ExpensesModule.openEdit(${ex.rowIndex})">✏️</button> <button class="btn btn-sm btn-danger" onclick="ExpensesModule.del(${ex.rowIndex})">🗑️</button></td>
    </tr>`).join('');}

  function openAdd(){$id('ex-mt').textContent='إضافة مصروف';$id('ex-date').value=new Date().toISOString().split('T')[0];['ex-operation','ex-item','ex-amount','ex-notes'].forEach(i=>$id(i).value='');$id('ex-type').value='ثابت';$id('ex-op-lbl').textContent='التشغيلة *';$id('ex-ri').value='';$id('ex-id').value='';$id('ex-modal').classList.add('active');}
  function openEdit(idx){const ex=data.find(x=>x.rowIndex===idx);if(!ex)return;$id('ex-mt').textContent='تعديل مصروف';$id('ex-date').value=ex.date;$id('ex-operation').value=ex.operation;$id('ex-type').value=ex.type;$id('ex-item').value=ex.item;$id('ex-amount').value=ex.amount;$id('ex-notes').value=ex.notes;$id('ex-ri').value=idx;$id('ex-id').value=ex.id;toggleOp();$id('ex-modal').classList.add('active');}
  function closeModal(){$id('ex-modal').classList.remove('active');}
  async function save(){
    const d={id:$id('ex-id').value,date:$id('ex-date').value,operation:$id('ex-operation').value,type:$id('ex-type').value,item:$id('ex-item').value,amount:$id('ex-amount').value,notes:$id('ex-notes').value};
    if(!d.item||!d.amount){showToast('أدخل البند والمبلغ','error');return;}
    if((d.type==='ثابت'||d.type==='متغير')&&!d.operation){showToast('التشغيلة إجبارية لهذا النوع','error');return;}
    const ri=$id('ex-ri').value;
    try{if(ri){await upd(parseInt(ri),d);showToast('تم التعديل ✅','success');}else{await add(d);showToast('تمت الإضافة ✅','success');}closeModal();renderData();}
    catch(e){showToast('حدث خطأ','error');}
  }
  async function del(idx){if(!confirm('هل تريد حذف هذا المصروف؟'))return;try{await rem(idx);showToast('تم الحذف','success');renderData();}catch(e){showToast('حدث خطأ','error');}}
  return{renderPage,renderData,openAdd,openEdit,closeModal,save,del,toggleOp,getAll:()=>data,load};
})();

// REPORTS
const ReportsModule=(()=>{
  function renderPage(){return `
    <div class="page-header"><h1>📊 التقارير والملخصات</h1><p>الأرباح والملخصات المالية</p></div>
    <div id="rp-loading" class="loading"><div class="spinner"></div> جاري تحميل البيانات...</div>
    <div id="rp-content" style="display:none">
      <div class="stats-grid" id="rp-stats"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0">
        <div class="card"><div class="card-header"><span class="card-title">📈 ملخص التشغيلات</span></div>
          <div class="table-wrap"><table><thead><tr><th>الوجهة</th><th>الرحلات</th><th>الإيرادات</th></tr></thead><tbody id="rp-dest"></tbody></table></div></div>
        <div class="card"><div class="card-header"><span class="card-title">💸 ملخص المصاريف</span></div>
          <div class="table-wrap"><table><thead><tr><th>النوع</th><th>البنود</th><th>المبالغ</th></tr></thead><tbody id="rp-exp"></tbody></table></div></div>
      </div>
      <div class="card"><div class="card-header"><span class="card-title">🚌 أداء العربيات</span></div>
        <div class="table-wrap"><table><thead><tr><th>العربية</th><th>التشغيلات</th><th>الإيرادات</th><th>المصاريف</th><th>صافي الربح</th></tr></thead><tbody id="rp-veh"></tbody></table></div></div>
      <div class="card"><div class="card-header"><span class="card-title">🤝 أداء الموردين</span></div>
        <div class="table-wrap"><table><thead><tr><th>المورد</th><th>التشغيلات</th><th>الإيرادات</th><th>متوسط الإيراد</th></tr></thead><tbody id="rp-sup"></tbody></table></div></div>
    </div>`;}

  async function renderData(){
    await Promise.all([VehiclesModule.load(),OperationsModule.load(),ExpensesModule.load()]);
    const ops=OperationsModule.getAll(),exps=ExpensesModule.getAll();
    const tRev=ops.reduce((s,op)=>s+op.revenue,0);
    const tExp=exps.reduce((s,ex)=>s+ex.amount,0)+ops.reduce((s,op)=>s+op.opExp,0);
    const net=tRev-tExp;
    $id('rp-loading').style.display='none'; $id('rp-content').style.display='block';
    $id('rp-stats').innerHTML=`
      <div class="stat-card"><div class="stat-icon green">💰</div><div class="stat-info"><h3>${tRev.toLocaleString()} ج</h3><p>إجمالي الإيرادات</p></div></div>
      <div class="stat-card"><div class="stat-icon red">💸</div><div class="stat-info"><h3>${tExp.toLocaleString()} ج</h3><p>إجمالي المصاريف</p></div></div>
      <div class="stat-card"><div class="stat-icon ${net>=0?'blue':'orange'}">📊</div><div class="stat-info"><h3 style="color:${net>=0?'var(--accent-green)':'var(--accent-red)'}">${net.toLocaleString()} ج</h3><p>صافي الربح</p></div></div>
      <div class="stat-card"><div class="stat-icon blue">🚀</div><div class="stat-info"><h3>${ops.length}</h3><p>إجمالي التشغيلات</p></div></div>`;
    const dMap={};ops.forEach(op=>{if(!dMap[op.destination])dMap[op.destination]={c:0,r:0};dMap[op.destination].c++;dMap[op.destination].r+=op.revenue;});
    $id('rp-dest').innerHTML=!Object.keys(dMap).length?'<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">لا توجد بيانات</td></tr>':Object.entries(dMap).sort((a,b)=>b[1].r-a[1].r).map(([d,v])=>`<tr><td>${d}</td><td>${v.c}</td><td><strong style="color:var(--accent-green)">${v.r.toLocaleString()} ج</strong></td></tr>`).join('');
    const eMap={};exps.forEach(ex=>{if(!eMap[ex.type])eMap[ex.type]={c:0,a:0};eMap[ex.type].c++;eMap[ex.type].a+=ex.amount;});
    $id('rp-exp').innerHTML=!Object.keys(eMap).length?'<tr><td colspan="3" style="text-align:center;color:var(--text-muted)">لا توجد بيانات</td></tr>':Object.entries(eMap).map(([t,v])=>`<tr><td>${t}</td><td>${v.c}</td><td><strong style="color:var(--accent-red)">${v.a.toLocaleString()} ج</strong></td></tr>`).join('');
    const vMap={};ops.forEach(op=>{if(!vMap[op.vehicle])vMap[op.vehicle]={c:0,r:0,e:0};vMap[op.vehicle].c++;vMap[op.vehicle].r+=op.revenue;vMap[op.vehicle].e+=op.opExp;});exps.forEach(ex=>{if(ex.operation){const op=ops.find(o=>o.id===ex.operation);if(op&&op.vehicle&&vMap[op.vehicle])vMap[op.vehicle].e+=ex.amount;}});
    $id('rp-veh').innerHTML=!Object.keys(vMap).length?'<tr><td colspan="5" style="text-align:center;color:var(--text-muted)">لا توجد بيانات</td></tr>':Object.entries(vMap).map(([p,v])=>{const n=v.r-v.e;return`<tr><td><strong>${p}</strong></td><td>${v.c}</td><td style="color:var(--accent-green)">${v.r.toLocaleString()} ج</td><td style="color:var(--accent-red)">${v.e.toLocaleString()} ج</td><td><strong style="color:${n>=0?'var(--accent-green)':'var(--accent-red)'}">${n.toLocaleString()} ج</strong></td></tr>`;}).join('');
    const sMap={};ops.forEach(op=>{if(!op.supplier)return;if(!sMap[op.supplier])sMap[op.supplier]={c:0,r:0};sMap[op.supplier].c++;sMap[op.supplier].r+=op.revenue;});
    $id('rp-sup').innerHTML=!Object.keys(sMap).length?'<tr><td colspan="4" style="text-align:center;color:var(--text-muted)">لا توجد بيانات</td></tr>':Object.entries(sMap).sort((a,b)=>b[1].r-a[1].r).map(([s,v])=>`<tr><td><strong>${s}</strong></td><td>${v.c}</td><td style="color:var(--accent-green)">${v.r.toLocaleString()} ج</td><td>${Math.round(v.r/v.c).toLocaleString()} ج</td></tr>`).join('');
  }
  return{renderPage,renderData};
})();

// APP
const App=(()=>{
  let cur='home', sidebarOpen=true;

  function toggleSidebar(){
    sidebarOpen=!sidebarOpen;
    $id('sidebar').classList.toggle('collapsed',!sidebarOpen);
    $id('main-content').classList.toggle('expanded',!sidebarOpen);
    $id('sidebar-toggle').classList.toggle('open',!sidebarOpen);
  }

  async function navigate(page){
    cur=page;
    // أوتو-كلوز الـ sidebar
    sidebarOpen=false;
    $id('sidebar').classList.add('collapsed');
    $id('main-content').classList.add('expanded');
    $id('sidebar-toggle').classList.add('open');
    // إظهار/إخفاء زرار التصدير
    $id('btn-export').style.display = page==='home' ? 'none' : 'flex';
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
    const nav=$id(`nav-${page}`);if(nav)nav.classList.add('active');
    const main=$id('main-content');
    if(page==='home')await renderHome();
    else if(page==='vehicles'){main.innerHTML=VehiclesModule.renderPage();VehiclesModule.renderData();}
    else if(page==='operations'){await VehiclesModule.load();main.innerHTML=OperationsModule.renderPage();OperationsModule.renderData();}
    else if(page==='expenses'){await OperationsModule.load();main.innerHTML=ExpensesModule.renderPage();ExpensesModule.renderData();}
    else if(page==='reports'){main.innerHTML=ReportsModule.renderPage();ReportsModule.renderData();}
  }

  async function renderHome(){
    const main=$id('main-content');
    const ds=new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    main.innerHTML=`
      <div class="home-banner"><div class="date">${ds}</div><h2>👋 أهلاً بك في نظام Oceanus</h2></div>
      <div id="home-stats" class="stats-grid"><div class="loading"><div class="spinner"></div></div></div>
      <div class="bottom-grid">
        <div class="card"><div class="card-header"><span class="card-title">🟢 التشغيلات الجارية حالياً</span></div><div id="home-active"><div class="loading"><div class="spinner"></div></div></div></div>
        <div class="card"><div class="card-header"><span class="card-title">💸 آخر المصاريف</span><button class="btn btn-sm btn-outline" onclick="App.navigate('expenses')">عرض الكل</button></div><div id="home-lastexp"><div class="loading"><div class="spinner"></div></div></div></div>
      </div>`;
    try{
      await Promise.all([VehiclesModule.load(),OperationsModule.load(),ExpensesModule.load()]);
      const ops=OperationsModule.getAll(),exps=ExpensesModule.getAll();
      const tRev=ops.reduce((s,op)=>s+op.revenue,0);
      const tExp=exps.reduce((s,ex)=>s+ex.amount,0)+ops.reduce((s,op)=>s+op.opExp,0);
      const net=tRev-tExp;
      $id('home-stats').innerHTML=`
        <div class="stat-card"><div class="stat-icon orange">🚀</div><div class="stat-info"><h3>${ops.length}</h3><p>إجمالي التشغيلات</p></div></div>
        <div class="stat-card"><div class="stat-icon green">💰</div><div class="stat-info"><h3>${tRev.toLocaleString()} ج</h3><p>إجمالي الإيرادات</p></div></div>
        <div class="stat-card"><div class="stat-icon red">💸</div><div class="stat-info"><h3>${tExp.toLocaleString()} ج</h3><p>إجمالي المصاريف</p></div></div>
        <div class="stat-card"><div class="stat-icon ${net>=0?'blue':'red'}">📊</div><div class="stat-info"><h3 style="color:${net>=0?'var(--accent-green)':'var(--accent-red)'}">${net.toLocaleString()} ج</h3><p>صافي الربح</p></div></div>`;
      const aOps=ops.filter(op=>op.status==='جارية');
      $id('home-active').innerHTML=!aOps.length
        ?'<div class="empty-state"><p>لا توجد تشغيلات جارية حالياً</p></div>'
        :aOps.map(op=>`<div class="active-op-item" id="aop-${op.rowIndex}"><div class="active-op-info"><strong>🚌 ${op.vehicle} ← ${op.destination}</strong><span>${op.supplier||'—'} | ${op.date}</span></div><button class="btn btn-sm btn-success" onclick="App.completeOp(${op.rowIndex})">✅ اكتملت</button></div>`).join('');
      const lExp=exps.slice(-5).reverse();
      $id('home-lastexp').innerHTML=!lExp.length
        ?'<div class="empty-state"><p>لا توجد مصاريف بعد</p></div>'
        :`<table style="width:100%;font-size:13px">${lExp.map(ex=>`<tr><td style="padding:8px 0;border-bottom:1px solid var(--border)">${ex.date}</td><td style="padding:8px 0;border-bottom:1px solid var(--border)">${ex.item}</td><td style="padding:8px 0;border-bottom:1px solid var(--border);color:var(--accent-red);font-weight:700">${ex.amount.toLocaleString()} ج</td></tr>`).join('')}</table>`;
    }catch(e){$id('home-stats').innerHTML='<div class="empty-state"><p>❌ خطأ في تحميل البيانات</p></div>';}
  }

  function refresh(){navigate(cur);}
  function showExportPopup(){$id('export-popup').classList.add('active');}
  function hideExportPopup(){$id('export-popup').classList.remove('active');}

  async function completeOp(rowIndex){
    const ops=OperationsModule.getAll();
    const op=ops.find(o=>o.rowIndex===rowIndex);
    if(!op)return;
    try{
      await SheetsAPI.upd(CONFIG.SHEETS.OPERATIONS,rowIndex,[op.id,op.date,op.vehicle,op.supplier,op.destination,op.revenue,op.opExp,'مكتملة',op.notes]);
      const el=$id(`aop-${rowIndex}`);
      if(el){el.style.transition='opacity 0.3s';el.style.opacity='0';setTimeout(()=>{el.remove();const box=$id('home-active');if(box&&!box.querySelector('.active-op-item'))box.innerHTML='<div class="empty-state"><p>لا توجد تشغيلات جارية حالياً</p></div>';},300);}
      showToast('تم إكمال التشغيلة ✅','success');
    }catch(e){showToast('حدث خطأ','error');}
  }

  function exportExcel(){
    hideExportPopup();
    let csv='\uFEFF', filename='oceanus';
    const date=new Date().toISOString().split('T')[0];
    if(cur==='vehicles'){
      const vs=VehiclesModule.getAll();
      csv+='النوع,الماركة,الموديل,رقم اللوحة,الحالة\n';
      vs.forEach(v=>csv+=`${v.type},${v.brand},${v.model},${v.plate},${v.status}\n`);
      filename=`oceanus-vehicles-${date}`;
    } else if(cur==='operations'){
      const ops=OperationsModule.getAll();
      csv+='التاريخ,العربية,المورد,الوجهة,الإيراد,مصاريف,الحالة\n';
      ops.forEach(op=>csv+=`${op.date},${op.vehicle},${op.supplier},${op.destination},${op.revenue},${op.opExp},${op.status}\n`);
      filename=`oceanus-operations-${date}`;
    } else if(cur==='expenses'){
      const exps=ExpensesModule.getAll();
      csv+='التاريخ,النوع,البند,المبلغ\n';
      exps.forEach(ex=>csv+=`${ex.date},${ex.type},${ex.item},${ex.amount}\n`);
      filename=`oceanus-expenses-${date}`;
    } else {
      const ops=OperationsModule.getAll(),exps=ExpensesModule.getAll(),vs=VehiclesModule.getAll();
      csv+='العربيات\nالنوع,الماركة,الموديل,رقم اللوحة,الحالة\n';
      vs.forEach(v=>csv+=`${v.type},${v.brand},${v.model},${v.plate},${v.status}\n`);
      csv+='\nالتشغيلات\nالتاريخ,العربية,المورد,الوجهة,الإيراد,مصاريف,الحالة\n';
      ops.forEach(op=>csv+=`${op.date},${op.vehicle},${op.supplier},${op.destination},${op.revenue},${op.opExp},${op.status}\n`);
      csv+='\nالمصاريف\nالتاريخ,النوع,البند,المبلغ\n';
      exps.forEach(ex=>csv+=`${ex.date},${ex.type},${ex.item},${ex.amount}\n`);
      filename=`oceanus-all-${date}`;
    }
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${filename}.csv`;a.click();
    showToast('تم التصدير كـ Excel ✅','success');
  }

  function exportPDF(){
    hideExportPopup();
    const ops=OperationsModule.getAll(),exps=ExpensesModule.getAll();
    const tRev=ops.reduce((s,op)=>s+op.revenue,0);
    const tExp=exps.reduce((s,ex)=>s+ex.amount,0)+ops.reduce((s,op)=>s+op.opExp,0);
    const net=tRev-tExp;
    const w=window.open('','_blank');
    w.document.write(`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><title>Oceanus Report</title><style>
    body{font-family:Arial,sans-serif;direction:rtl;padding:30px;color:#1a2533}
    h1{color:#1a3a5c;margin-bottom:4px}h3{color:#1a3a5c;margin:20px 0 8px}
    table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
    th,td{border:1px solid #ddd;padding:7px 10px;text-align:right}
    th{background:#1a3a5c;color:white}
    .summary{display:flex;gap:16px;margin:16px 0}
    .box{flex:1;border:2px solid #ddd;border-radius:8px;padding:14px;text-align:center}
    .box h2{font-size:20px;margin:0}.box p{font-size:11px;color:#999;margin-top:4px}
    </style></head><body>
    <h1>🌊 Oceanus Tours & Travel</h1>
    <p style="color:#999;font-size:12px">${new Date().toLocaleDateString('ar-EG',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
    <div class="summary">
      <div class="box"><h2 style="color:#2ecc71">${tRev.toLocaleString()} ج</h2><p>إجمالي الإيرادات</p></div>
      <div class="box"><h2 style="color:#e74c3c">${tExp.toLocaleString()} ج</h2><p>إجمالي المصاريف</p></div>
      <div class="box"><h2 style="color:${net>=0?'#2ecc71':'#e74c3c'}">${net.toLocaleString()} ج</h2><p>صافي الربح</p></div>
      <div class="box"><h2 style="color:#2d6ea8">${ops.length}</h2><p>إجمالي التشغيلات</p></div>
    </div>
    <h3>التشغيلات</h3>
    <table><thead><tr><th>التاريخ</th><th>العربية</th><th>المورد</th><th>الوجهة</th><th>الإيراد</th><th>المصاريف</th><th>الحالة</th></tr></thead>
    <tbody>${ops.map(op=>`<tr><td>${op.date}</td><td>${op.vehicle}</td><td>${op.supplier}</td><td>${op.destination}</td><td>${op.revenue.toLocaleString()} ج</td><td>${op.opExp.toLocaleString()} ج</td><td>${op.status}</td></tr>`).join('')}</tbody></table>
    <h3>المصاريف</h3>
    <table><thead><tr><th>التاريخ</th><th>النوع</th><th>البند</th><th>المبلغ</th></tr></thead>
    <tbody>${exps.map(ex=>`<tr><td>${ex.date}</td><td>${ex.type}</td><td>${ex.item}</td><td>${ex.amount.toLocaleString()} ج</td></tr>`).join('')}</tbody></table>
    </body></html>`);
    w.document.close();setTimeout(()=>w.print(),500);
    showToast('تم فتح PDF للطباعة ✅','success');
  }

  async function init(){
    try{showToast('جاري تهيئة النظام...');await SheetsAPI.init();navigate('home');}
    catch(e){$id('main-content').innerHTML=`<div class="card" style="margin-top:40px;text-align:center;padding:40px"><div style="font-size:40px;margin-bottom:16px">❌</div><h2 style="color:var(--accent-red)">خطأ في الاتصال</h2><p style="color:var(--text-muted);margin-top:8px">تحقق من الـ credentials وحاول مرة أخرى</p><button class="btn btn-primary" style="margin-top:16px" onclick="App.init()">إعادة المحاولة</button></div>`;}
  }
  return{navigate,refresh,toggleSidebar,showExportPopup,hideExportPopup,exportExcel,exportPDF,init};
})();

App.init();
