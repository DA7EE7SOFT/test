<!--
==============================
1️⃣ SQL FUNCTION (انسخها وحطها في Supabase SQL Editor)
==============================

create or replace function complete_sale(
    p_subtotal numeric,
    p_tax numeric,
    p_discount numeric,
    p_total numeric,
    p_payment_method text,
    p_branch text,
    p_customer_id uuid,
    p_items jsonb
)
returns void
language plpgsql
as $$
declare
    v_invoice_id uuid;
    item jsonb;
    current_stock integer;
begin
    insert into invoices (
        date,
        subtotal,
        tax,
        discount,
        total,
        payment_method,
        branch,
        customer_id
    )
    values (
        now(),
        p_subtotal,
        p_tax,
        p_discount,
        p_total,
        p_payment_method,
        p_branch,
        p_customer_id
    )
    returning id into v_invoice_id;

    for item in select * from jsonb_array_elements(p_items)
    loop
        select stock into current_stock
        from products
        where id = (item->>'product_id')::uuid;

        if current_stock < (item->>'quantity')::integer then
            raise exception 'Insufficient stock';
        end if;

        insert into invoice_items (
            invoice_id,
            product_id,
            product_name,
            price,
            quantity,
            tax
        )
        values (
            v_invoice_id,
            (item->>'product_id')::uuid,
            item->>'product_name',
            (item->>'price')::numeric,
            (item->>'quantity')::integer,
            (item->>'tax')::numeric
        );

        update products
        set stock = stock - (item->>'quantity')::integer
        where id = (item->>'product_id')::uuid;
    end loop;
end;
$$;

-->

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>POS System</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial;
    display: flex;
    margin: 0;
}

#products-grid {
    width: 60%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    padding: 10px;
}

.product-card {
    border: 1px solid #ccc;
    padding: 10px;
    cursor: pointer;
    border-radius: 6px;
    transition: 0.2s;
}

.product-card:hover {
    background: #f5f5f5;
}

.out-of-stock {
    opacity: 0.4;
    pointer-events: none;
}

#cart {
    width: 40%;
    padding: 15px;
    border-left: 2px solid #ddd;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
}

button {
    padding: 10px;
    margin-top: 10px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="products-grid"></div>

<div id="cart">
<h3>السلة</h3>
<div id="cart-items"></div>
<hr>
<p>المجموع: <span id="subtotal">0</span></p>
<p>الضريبة: <span id="tax">0</span></p>
<p>الخصم: <span id="discount-display">0</span></p>
<p><strong>الإجمالي: <span id="total">0</span></strong></p>
<button onclick="completeSale()">إتمام البيع</button>
</div>

<script>

// ==========================
// Supabase Config
// ==========================
const supabaseUrl = "YOUR_SUPABASE_URL";
const supabaseKey = "YOUR_SUPABASE_ANON_KEY";
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

// ==========================
// State
// ==========================
let products = [];
let cart = [];
let discount = { type: 'fixed', value: 0, amount: 0 };
let selectedCustomerId = null;
let currentPaymentMethod = 'cash';
let currentBranch = 'main';

// ==========================
// Load Products
// ==========================
async function loadAllFromSupabase() {
    const { data } = await supabase
        .from('products')
        .select('*')
        .order('name');

    products = data || [];
    renderProducts();
    renderCart();
}

// ==========================
// Render Products
// ==========================
function renderProducts(filter = '') {
    const grid = document.getElementById('products-grid');
    const search = filter.toLowerCase();

    let filtered = products.filter(p =>
        p.name.toLowerCase().includes(search) ||
        (p.barcode && p.barcode.toLowerCase().includes(search))
    );

    grid.innerHTML = filtered.map(p => `
        <div class="product-card ${p.stock <= 0 ? 'out-of-stock' : ''}" data-id="${p.id}">
            <div>${p.name}</div>
            <div>${Number(p.price).toFixed(2)} ج</div>
            <div>المخزون: ${p.stock}</div>
        </div>
    `).join('');

    grid.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', () => {
            const id = card.dataset.id;
            const product = products.find(p => p.id == id);
            if (product && product.stock > 0) addToCart(product);
        });
    });
}

// ==========================
// Cart
// ==========================
function addToCart(product) {
    const existing = cart.find(i => i.id === product.id);

    if (existing) {
        if (existing.quantity < product.stock) {
            existing.quantity++;
        }
    } else {
        cart.push({
            id: product.id,
            name: product.name,
            price: Number(product.price),
            tax: Number(product.tax || 0),
            quantity: 1
        });
    }

    renderCart();
}

function renderCart() {
    const container = document.getElementById('cart-items');

    container.innerHTML = cart.map(item => `
        <div class="cart-item">
            <span>${item.name}</span>
            <span>${item.quantity} × ${item.price.toFixed(2)}</span>
        </div>
    `).join('');

    updateSummary();
}

// ==========================
// Summary
// ==========================
function updateSummary() {
    const subtotal = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);

    const tax = cart.reduce((acc, item) => {
        const totalItem = item.price * item.quantity;
        return acc + (totalItem * item.tax / 100);
    }, 0);

    const total = subtotal + tax - discount.amount;

    document.getElementById('subtotal').innerText = subtotal.toFixed(2);
    document.getElementById('tax').innerText = tax.toFixed(2);
    document.getElementById('discount-display').innerText = discount.amount.toFixed(2);
    document.getElementById('total').innerText = total.toFixed(2);
}

// ==========================
// Complete Sale (RPC)
// ==========================
async function completeSale() {
    if (cart.length === 0) {
        alert('لا توجد منتجات');
        return;
    }

    try {
        const subtotal = cart.reduce((acc, item) => acc + item.price * item.quantity, 0);

        const tax = cart.reduce((acc, item) => {
            const totalItem = item.price * item.quantity;
            return acc + (totalItem * item.tax / 100);
        }, 0);

        const total = subtotal + tax - discount.amount;

        const itemsPayload = cart.map(item => ({
            product_id: item.id,
            product_name: item.name,
            price: item.price,
            quantity: item.quantity,
            tax: item.tax
        }));

        const { error } = await supabase.rpc('complete_sale', {
            p_subtotal: subtotal,
            p_tax: tax,
            p_discount: discount.amount,
            p_total: total,
            p_payment_method: currentPaymentMethod,
            p_branch: currentBranch,
            p_customer_id: selectedCustomerId || null,
            p_items: itemsPayload
        });

        if (error) throw error;

        cart = [];
        discount = { type: 'fixed', value: 0, amount: 0 };

        await loadAllFromSupabase();

        alert('تمت العملية بنجاح 🚀');

    } catch (err) {
        console.error(err);
        alert('فشل إتمام العملية');
    }
}

// ==========================
document.addEventListener('DOMContentLoaded', loadAllFromSupabase);

</script>

</body>
</html>
